name: Flutter CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - "release/*"
      - "hotfix/*"

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - run: flutter analyze --no-fatal-warnings
      - run: flutter test

  release:
    name: Release
    needs: ci
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - run: flutter build apk --release --obfuscate --split-debug-info=build/obfuscation/
      - name: Generate version.json
        run: |
          echo '{
            "version": "'${GITHUB_REF_NAME#v}'",
            "buildNumber": '$GITHUB_RUN_NUMBER',
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/aricie-release.apk",
            "releaseNotes": "Consultez les notes de version sur GitHub.",
            "forceUpdate": false,
            "releaseDate": "'$(date -u +%Y-%m-%d)'"
          }' > version.json
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            version.json
