name: Flutter CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
      - "release/*"
      - "hotfix/*"

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - run: flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos || true
      - run: flutter test

  release:
    name: Release
    needs: ci
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - name: Lire la version du pubspec (source unique de vérité)
        id: ver
        run: |
          PV=$(grep '^version:' pubspec.yaml | awk '{print $2}')   # ex: 1.5.0+2
          echo "name=${PV%%+*}"  >> "$GITHUB_OUTPUT"               # 1.5.0
          echo "build=${PV##*+}" >> "$GITHUB_OUTPUT"               # 2
      - name: Vérifier que le tag correspond au pubspec
        run: |
          test "v${{ steps.ver.outputs.name }}" = "$GITHUB_REF_NAME" \
            || { echo "::error::Tag $GITHUB_REF_NAME != pubspec v${{ steps.ver.outputs.name }} — bumpez le pubspec avant de tagger."; exit 1; }
      - run: flutter build apk --release --obfuscate --split-debug-info=build/obfuscation/
      - name: Generate version.json
        run: |
          echo '{
            "version": "${{ steps.ver.outputs.name }}",
            "buildNumber": ${{ steps.ver.outputs.build }},
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/app-release.apk",
            "releaseNotes": "Consultez les notes de version sur GitHub.",
            "forceUpdate": false,
            "releaseDate": "'$(date -u +%Y-%m-%d)'"
          }' > version.json
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            version.json
