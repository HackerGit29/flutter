name: innovation
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  mqtt_client: ^10.8.0
  supabase_flutter: ^2.8.4
  flutter_riverpod: ^2.6.1
  flutter_animate: ^4.5.2
  uuid: ^4.5.1
  audioplayers: ^6.2.0
  flutter_local_notifications: ^18.0.1
  timeago: ^3.7.0
  fl_chart: ^0.70.2
  syncfusion_flutter_charts: ^28.2.7
  intl: ^0.19.0
  carousel_slider: ^5.0.0
  flutter_svg: ^2.0.17
  flutter_staggered_animations: ^1.1.1
  lottie: ^3.3.1
  shared_preferences: ^2.5.2
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

# Separate configuration for flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app.ico"
  web:
    generate: true
  windows:
    generate: true
    image_path: "assets/images/app.ico"
    icon_size: 48
  macos:
    generate: true

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/images/
    - assets/sounds/
