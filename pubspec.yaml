name: aricie
description: "A new Flutter project."
publish_to: "none"
version: 1.2.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  mqtt5_client: ^4.17.1
  supabase_flutter: ^2.8.4
  flutter_riverpod: ^2.6.1
  flutter_animate: ^4.5.2
  uuid: ^4.5.1
  flutter_local_notifications: ^19.2.1
  timeago: ^3.7.0
  fl_chart: ^1.0.0
  syncfusion_flutter_charts: ^29.2.5
  intl: ^0.20.2
  carousel_slider: ^5.0.0
  flutter_svg: ^2.0.17
  flutter_staggered_animations: ^1.1.1
  lottie: ^3.3.1
  shared_preferences: ^2.5.2
  provider: ^6.1.2
  get_it: ^8.2.0
  dartz: ^0.10.1
  equatable: ^2.0.7
  flutter_secure_storage: ^9.2.4
  google_fonts: ^6.2.0
  crypto: ^3.0.6
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.3.0
  path_provider: ^2.1.2
  android_intent_plus: ^5.3.0
  device_info_plus: ^11.4.0
  http: ^1.2.0
  speech_to_text: 7.4.0
  flutter_tts: ^3.8.3
  permission_handler: ^11.0.0
  record: 7.1.0
  audioplayers: ^6.1.0
  package_info_plus: ^8.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_gherkin: ^2.0.0
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

# Separate configuration for flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app.png"
  web:
    generate: true
  windows:
    generate: true
    image_path: "assets/images/app.png"
    icon_size: 48
  macos:
    generate: true

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/images/
