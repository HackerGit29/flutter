name: aricie
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  mqtt_client: ^10.8.0
  supabase_flutter: ^2.8.4
  flutter_riverpod: ^2.6.1
  flutter_animate: ^4.5.2
  uuid: ^4.5.1
  flutter_local_notifications: ^19.2.1
  timeago: ^3.7.0
  fl_chart: ^1.0.0
  syncfusion_flutter_charts: ^29.2.5
  intl: ^0.20.2
  carousel_slider: ^5.0.0
  flutter_svg: ^2.0.17
  flutter_staggered_animations: ^1.1.1
  lottie: ^3.3.1
  shared_preferences: ^2.5.2
  provider: ^6.1.2
  crypto: ^3.0.6
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.3.0
  path_provider: ^2.1.2
  android_intent_plus: ^5.3.0
  device_info_plus: ^11.4.0
dependency_overrides:
  web: 1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

# Separate configuration for flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app.png"
  web:
    generate: true
  windows:
    generate: true
    image_path: "assets/images/app.png"
    icon_size: 48
  macos:
    generate: true

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/images/
